<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дім</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-secondary-bg-color,#f1f2f6);
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#fff));
  --text:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#8a8f98);
  --link:var(--tg-theme-link-color,#2481cc);
  --btn:var(--tg-theme-button-color,#2481cc);
  --btn-text:var(--tg-theme-button-text-color,#fff);
  --sep:color-mix(in srgb,var(--hint) 22%,transparent);
  --soft:color-mix(in srgb,var(--hint) 12%,transparent);
  --ok:#2fa84f; --warn:#e6a100; --bad:#e5484d; --heat:#f06a2a; --cool:#2f8fe6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:0 12px calc(16px + env(safe-area-inset-bottom))}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;padding:10px 0 8px;background:var(--bg)}
.tab{flex:1;min-width:0;border:0;border-radius:10px;padding:9px 2px;font:inherit;font-weight:600;font-size:14px;white-space:nowrap;
  background:var(--card);color:var(--hint);cursor:pointer}
.refresh{flex:none;width:42px;border:0;border-radius:10px;background:var(--card);color:var(--text);cursor:pointer;font-size:18px}
.refresh.spin span{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tab.on{background:var(--btn);color:var(--btn-text)}
.card{background:var(--card);border-radius:14px;padding:14px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.muted{color:var(--hint)}
.small{font-size:13px}
.big{font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.mid{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.title{font-weight:650;font-size:16px;white-space:nowrap}
.stat{background:var(--soft);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--hint)}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:13px;font-weight:600}
.p-ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.p-bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.p-warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.p-heat{background:color-mix(in srgb,var(--heat) 18%,transparent);color:var(--heat)}
.p-cool{background:color-mix(in srgb,var(--cool) 18%,transparent);color:var(--cool)}
.p-off{background:var(--soft);color:var(--hint)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .4s}
.phase{display:grid;grid-template-columns:28px 1fr 64px;gap:8px;align-items:center;margin-top:6px}
.btn{border:0;border-radius:10px;padding:9px 12px;font:inherit;font-weight:650;cursor:pointer;
  background:var(--soft);color:var(--text);min-width:44px}
.btn:active{opacity:.6}
.btn.primary{background:var(--btn);color:var(--btn-text)}
.btn[disabled]{opacity:.35}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.seg .btn{flex:1;padding:8px 6px;font-size:14px}
.seg .btn.on{background:var(--btn);color:var(--btn-text)}
.temp-ctl{display:flex;align-items:center;gap:8px}
.temp-ctl .val{min-width:62px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.pending{opacity:.55}
select{font:inherit;border:0;border-radius:10px;padding:8px;background:var(--soft);color:var(--text)}
.msg{text-align:center;padding:40px 16px;color:var(--hint)}
.foot{text-align:center;font-size:12px;color:var(--hint);margin-top:6px}
.hidden{display:none}
.banner{display:flex;align-items:center;gap:8px;border-radius:12px;padding:10px 12px;margin:0 0 10px;
  background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--text);font-size:14px}
.banner b{color:var(--bad)}
.wait{display:inline-block;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.p-sync{background:color-mix(in srgb,var(--btn) 18%,transparent);color:var(--btn)}
/* metrics row: number, smaller unit, label under it, thin dividers */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);padding:14px 4px 12px}
.m{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.m+.m::before{content:"";position:absolute;left:0;top:10%;bottom:10%;width:1px;background:var(--sep)}
.mv{font-size:20px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.mv small{font-size:12px;font-weight:500;letter-spacing:0;color:var(--hint);margin-left:2px}
.ml{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--hint);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
/* quick toggles */
.quick{display:grid;gap:8px;margin:0 0 10px}
.qbtn{border:0;border-radius:14px;padding:12px 8px;background:var(--card);color:var(--text);cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:4px;min-height:92px;font:inherit}
.qbtn .ic{font-size:22px;line-height:1}
.qbtn .lb{font-weight:650;font-size:14px;line-height:1.15}
.qbtn .st{font-size:12px;color:var(--hint);line-height:1.2}
.qbtn.on{background:var(--btn);color:var(--btn-text)}
.qbtn.on .st{color:color-mix(in srgb,var(--btn-text) 80%,transparent)}
.qbtn[disabled]{opacity:.4}
.qbtn.pend{animation:blink 1.4s ease-in-out infinite}
.locked{opacity:.55}
.lockline{margin-top:10px;font-size:13px;color:var(--hint)}
/* in-page chooser (Telegram popups allow only 3 buttons) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet{background:var(--card);border-radius:16px;width:min(330px,100%);padding:18px 18px 8px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.sheet h3{margin:0 0 8px;font-size:17px}
.sheet p{margin:0 0 12px;white-space:pre-line;font-size:14.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{border:0;border-radius:99px;padding:6px 11px;background:var(--soft);color:var(--text);cursor:pointer;font:inherit;font-size:13.5px;font-weight:600}
.chip.on{background:var(--btn);color:var(--btn-text)}
.sbtns{display:flex;justify-content:flex-end;gap:4px;border-top:1px solid var(--sep);padding-top:6px}
.sbtns button{border:0;background:none;color:var(--link);font:inherit;font-weight:650;padding:10px 12px;cursor:pointer;border-radius:8px}
@media (prefers-reduced-motion:reduce){.wait,.qbtn.pend,.refresh.spin span{animation:none}}
</style>
</head>
<body>
<nav class="tabs" id="tabs">
  <button class="tab on" data-tab="energy">⚡ Енергія</button>
  <button class="tab" data-tab="heating">🔥 Опалення</button>
  <button class="tab" data-tab="ac">❄️ Кондиц.</button>
  <button class="refresh" id="refresh" title="Оновити все" aria-label="Оновити все"><span>↻</span></button>
</nav>
<div id="sheet-root"></div>
<main id="app"><div class="msg">Завантаження…</div></main>
<div class="foot" id="foot"></div>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
const INIT = tg ? tg.initData : "";
const POLL_MS = 5000;
let S = null;            // last /state payload
let tab = "energy";
let busy = {};           // entity_id -> true while an action is in flight
let pendingTemp = {};    // entity_id -> {value, timer}
let lastOk = 0;

try { const t = localStorage.getItem("tgapp.tab"); if (["energy", "heating", "ac"].includes(t)) tab = t; } catch (e) {}

if (tg) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }

// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const st = (id) => (S && S.states[id]) || null;
const val = (id) => { const x = st(id); return x ? x.s : null; };
const num = (id) => { const v = parseFloat(val(id)); return Number.isFinite(v) ? v : null; };
const attr = (id, k) => { const x = st(id); return x && x.a ? x.a[k] : undefined; };
const fmt = (v, d = 0) => v == null ? "—" : Number(v).toLocaleString("uk-UA", {maximumFractionDigits: d, minimumFractionDigits: d});
const fmtW = (w) => w == null ? "—" : Math.abs(w) >= 1000 ? fmt(w / 1000, 1) + " кВт" : fmt(w) + " Вт";
const haptic = (t) => { try { tg && tg.HapticFeedback.impactOccurred(t || "light"); } catch (e) {} };
const notify = (t) => { try { tg && tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
function toast(text) {
  if (tg && tg.showAlert) { try { tg.showAlert(text); return; } catch (e) {} }
  alert(text);
}
function confirmBox(text) {
  return new Promise(res => {
    if (tg && tg.showConfirm) { try { tg.showConfirm(text, ok => res(!!ok)); return; } catch (e) {} }
    res(confirm(text));
  });
}
function since(iso) {
  const t = Date.parse(String(iso).replace(" ", "T"));
  if (!Number.isFinite(t)) return "";
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  return m < 60 ? m + " хв" : Math.floor(m / 60) + " год " + (m % 60) + " хв";
}
function hhmm(iso) {
  const d = new Date(String(iso).replace(" ", "T"));
  return isNaN(d) ? "" : d.toLocaleTimeString("uk-UA", {hour: "2-digit", minute: "2-digit"});
}

// Requested value that HA has not confirmed yet (cloud devices report late).
const isPending = (id) => { const x = st(id); return !!(x && x.p); };
const pendPill = (id) => isPending(id) ? `<span class="pill p-warn wait" title="Команду надіслано, чекаємо підтвердження">⏳ застосовується</span> ` : "";
function dateTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString("uk-UA", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"});
}

// ---------- outage ----------
function gridDown() {
  const id = S && S.layout.energy.grid_connected;
  return !!id && val(id) === "off";
}
function outageBanner() {
  if (!gridDown()) return "";
  const E = S.layout.energy, start = val(E.grid_outage_start), soc = num(E.battery_soc);
  const when = start ? ` з ${esc(hhmm(start))} (${esc(since(start))})` : "";
  return `<div class="banner">🔴 <div><b>Мережі немає</b>${when}. Живлення від батареї: ${fmt(soc)}%.</div></div>`;
}
// Text of the confirmation shown before a device is turned on during an outage.
function loadWarning(name, addW) {
  const E = S.layout.energy;
  const soc = num(E.battery_soc), bp = num(E.battery_power), load = num(E.load_power);
  const lines = [`Мережі немає. ${name} додасть ≈ ${fmtW(addW)} навантаження.`];
  if (load != null) lines.push(`Споживання: ${fmtW(load)} → ≈ ${fmtW(load + addW)}.`);
  if (soc != null) {
    let s = `Батарея: ${fmt(soc)}%`;
    const draw = (bp ?? 0) + addW;  // Deye: positive battery power = discharge
    const kwh = (soc - E.battery_min_soc) / 100 * E.battery_capacity_kwh;
    if (kwh <= 0) s += `, вже на мінімумі (${E.battery_min_soc}%)`;
    else if (draw > 30) {
      const h = kwh * 1000 / draw;
      s += `, вистачить ≈ ${h >= 1 ? fmt(h, 1) + " год" : Math.round(h * 60) + " хв"} до ${E.battery_min_soc}%`;
    }
    lines.push(s + ".");
  }
  lines.push("Увімкнути?");
  return lines.join("\n");
}
async function confirmTurnOn(name, addW) {
  if (!gridDown()) return true;
  return confirmBox(loadWarning(name, Number(addW) || 0));
}

// ---------- API ----------
async function api(path, opts = {}) {
  const r = await fetch(path, {
    method: opts.method || "GET",
    headers: Object.assign({"X-Telegram-Init-Data": INIT}, opts.body ? {"Content-Type": "application/json"} : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    cache: "no-store",
  });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error((j && (j.code || j.message)) || ("HTTP " + r.status)); err.status = r.status; err.code = j && j.code; throw err; }
  return j;
}

async function load() {
  try {
    S = await api("/api/tgapp/state");
    lastOk = Date.now();
    render();
  } catch (e) {
    showError(e);
  }
  $("#foot").textContent = lastOk ? "Оновлено " + new Date(lastOk).toLocaleTimeString("uk-UA") : "";
}

function showError(e) {
  if (S && e.status !== 401 && e.status !== 403) { $("#foot").textContent = "⚠️ Немає зв'язку з домом"; return; }
  let m = "Не вдалося завантажити дані.";
  if (!INIT) m = "Відкрий цю сторінку з Telegram-бота (кнопка меню).";
  else if (e.code === "expired") m = "Сесія застаріла. Закрий і відкрий Mini App знову.";
  else if (e.code === "forbidden") {
    const id = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "?";
    m = "Немає доступу. Попроси додати твій Telegram ID: " + id;
  } else if (e.status === 401) m = "Підпис Telegram не пройшов перевірку.";
  $("#app").innerHTML = `<div class="msg">${esc(m)}</div>`;
}

const ERR_TEXT = {
  away_mode: "увімкнено режим відсутності, спершу вимкни його",
  syncing: "оновлюю стан Vaillant, зачекай кілька секунд",
};
async function act(body, label, key) {
  const id = key || body.entity_id;
  busy[id] = true; render();
  try {
    const r = await api("/api/tgapp/action", {method: "POST", body});
    if (r && r.states) Object.assign(S.states, r.states);
    else if (r && r.state) S.states[id] = r.state;
    notify("success");
  } catch (e) {
    notify("error");
    toast((label ? label + ": " : "") + (e.status === 429 ? "забагато команд, зачекай хвилину"
      : ERR_TEXT[e.code] || "не вдалося (" + e.message + ")"));
  } finally {
    delete busy[id]; render();
    setTimeout(load, 2500);  // cloud devices confirm with a delay
  }
}

function bumpTemp(id, delta, label) {
  const step = Number(attr(id, "target_temp_step")) || (id.startsWith("water_heater.") ? 1 : 0.5);
  const lo = Number(attr(id, "min_temp")) || 7, hi = Number(attr(id, "max_temp")) || 35;
  const p = pendingTemp[id];
  const cur = p ? p.value : Number(attr(id, "temperature"));
  if (!Number.isFinite(cur)) return;
  const next = Math.min(hi, Math.max(lo, Math.round((cur + delta * step) / step) * step));
  haptic();
  if (p) clearTimeout(p.timer);
  pendingTemp[id] = {value: next, timer: setTimeout(() => {
    delete pendingTemp[id];
    act({action: "set_temperature", entity_id: id, temperature: next}, label);
  }, 900)};
  render();
}

// ---------- views ----------
function viewEnergy() {
  const E = S.layout.energy;
  const grid = val(E.grid_connected) === "on";
  const soc = num(E.battery_soc), bp = num(E.battery_power), pv = num(E.pv_power), load = num(E.load_power);
  let gridLine;
  if (grid) gridLine = `<span class="pill p-ok">🟢 Мережа є</span>`;
  else {
    const start = val(E.grid_outage_start);
    gridLine = `<span class="pill p-bad">🔴 Немає мережі</span>` +
      (start ? ` <span class="muted small">з ${esc(hhmm(start))} · ${esc(since(start))}</span>` : "");
  }
  // battery: positive = discharging (Deye convention)
  let bLabel = "в спокої", left = "";
  if (bp != null && bp > 30) {
    bLabel = "розряд " + fmtW(bp);
    if (soc != null) {
      const kwh = (soc - E.battery_min_soc) / 100 * E.battery_capacity_kwh;
      if (kwh > 0) { const h = kwh * 1000 / bp; left = `≈ ${h >= 1 ? fmt(h, 1) + " год" : Math.round(h * 60) + " хв"} до ${E.battery_min_soc}%`; }
    }
  } else if (bp != null && bp < -30) bLabel = "заряд " + fmtW(-bp);
  const minSoc = Number(E.battery_min_soc) || 0;
  const socColor = soc == null ? "var(--hint)" : soc < minSoc + 10 ? "var(--bad)" : soc < minSoc + 30 ? "var(--warn)" : "var(--ok)";
  const volts = E.grid_voltage.map(num);
  const phases = E.load_phase.map((id, i) => {
    const w = num(id); const lim = Number(E.phase_limit_w) || 0;
    const pct = w == null || lim <= 0 ? 0 : Math.max(0, Math.min(100, w / lim * 100));
    const c = pct > 85 ? "var(--bad)" : pct > 60 ? "var(--warn)" : "var(--ok)";
    return `<div class="phase"><span class="muted small">L${i + 1}</span><div class="bar"><i style="width:${pct}%;background:${c}"></i></div><span class="small" style="text-align:right">${fmtW(w)}</span></div>`;
  }).join("");
  const invState = val(E.inverter_state);
  return `
  <div class="card">
    <div class="row between">${gridLine}</div>
    <div class="row between" style="margin-top:12px;align-items:flex-end">
      <div><div class="big" style="color:${socColor}">${fmt(soc)}%</div><div class="muted small">батарея · ${esc(bLabel)}</div></div>
      <div style="text-align:right"><div class="mid">${fmtW(load)}</div><div class="muted small">споживання</div></div>
    </div>
    <div class="bar" style="margin-top:10px"><i style="width:${soc ?? 0}%;background:${socColor}"></i></div>
    ${left ? `<div class="small muted" style="margin-top:6px">${esc(left)}</div>` : ""}
  </div>
  <div class="card grid2">
    <div class="stat"><span>☀️ Сонце</span><b>${fmtW(pv)}</b></div>
    <div class="stat"><span>🔋 Батарея</span><b>${fmt(num(E.battery_voltage), 1)} В · ${fmt(num(E.battery_temperature))}°</b></div>
    <div class="stat" style="grid-column:1/-1"><span>🔌 Мережа L1 / L2 / L3</span><b>${volts.map(v => fmt(v)).join(" / ")} В</b></div>
  </div>
  <div class="card"><div class="title">Навантаження по фазах</div>${phases}</div>
  <div class="card"><div class="title" style="margin-bottom:8px">Сьогодні, кВт·год</div>
    <div class="grid4">
      <div class="stat"><span>☀️</span><b>${fmt(num(E.day_pv), 1)}</b></div>
      <div class="stat"><span>🏠</span><b>${fmt(num(E.day_load), 1)}</b></div>
      <div class="stat"><span>⬇️ з мер.</span><b>${fmt(num(E.day_import), 1)}</b></div>
      <div class="stat"><span>⬆️ в мер.</span><b>${fmt(num(E.day_export), 1)}</b></div>
    </div></div>
  <div class="card row between small"><span class="muted">Інвертор</span>
    <span><span class="pill ${invState === "ok" ? "p-ok" : "p-warn"}">${esc(invState ?? "—")}</span> · радіатор ${fmt(num(E.inverter_temp))}°</span></div>`;
}

const ZONE_MODES = [["off", "Вимк"], ["heat_cool", "Ручний"], ["auto", "Розклад"]];

// ---------- heating ----------
const awaySw = () => (S.layout.heating.away || {}).switch;
const awayOn = () => !!awaySw() && val(awaySw()) === "on";
// After away mode ends the zones and hot water are re-read from the cloud.
const syncing = () => (S.sync || 0) > 0 || (!!awaySw() && isPending(awaySw()) && val(awaySw()) === "off");
const vaillantLocked = () => awayOn() || syncing();
const syncPill = () => syncing() ? `<span class="pill p-sync wait">⟳ синхронізація</span>` : "";
const offPill = `<span class="pill p-off">⏹ вимкнено</span>`;
const heatPill = `<span class="pill p-heat">🔥 гріє</span>`;
const lockLine = () => awayOn() ? `<div class="lockline">🔒 Увімкнено режим відсутності. Щоб змінити, вимкни його.</div>`
  : syncing() ? `<div class="lockline">⟳ Оновлюю стан після режиму відсутності…</div>` : "";

function metric(value, digits, unit, label, color) {
  const c = color && color !== "inherit" ? color : "";
  return `<div class="m"><span class="mv"${c ? ` style="color:${c}"` : ""}>${fmt(value, digits)}<small>${unit}</small></span>` +
    `<span class="ml"${c ? ` style="color:${c}"` : ""}>${c ? `<i class="dot"></i>` : ""}${label}</span></div>`;
}

function heatingMetrics(H) {
  const pr = num(H.pressure);
  const prColor = pr == null ? "" : (pr < 1.0 || pr > 2.5) ? "var(--bad)" : pr < 1.2 ? "var(--warn)" : "";
  const dhw = (H.dhw || {}).water_heater;
  const items = [
    metric(num(H.outdoor), 1, "°C", "надворі"),
    metric(pr, 1, "бар", "тиск", prColor),
    metric(num(H.flow), 1, "°C", "подача"),
  ];
  if (dhw) items.push(metric(attr(dhw, "current_temperature"), 1, "°C", "гаряча вода"));
  return `<div class="card metrics" style="grid-template-columns:repeat(${items.length},1fr)">${items.join("")}</div>`;
}

function quickButtons(H) {
  const btns = [];
  const aw = awaySw();
  if (aw && st(aw)) {
    const on = awayOn(), pend = isPending(aw) || !!busy.away || !!busy[aw];
    const end = attr(aw, "holiday_end_date_time");
    const sub = pend ? "застосовується…" : on ? (end ? "до " + esc(dateTime(end)) : "увімкнено") : "вимкнено";
    btns.push(`<button class="qbtn ${on ? "on" : ""} ${pend ? "pend" : ""}" data-q="away" ${pend ? "disabled" : ""}>
      <span class="ic">🧳</span><span class="lb">Відсутність</span><span class="st">${sub}</span></button>`);
  }
  if (H.zones.length) {
    const known = H.zones.filter(z => st(z.climate));
    const onCount = known.filter(z => val(z.climate) !== "off").length;
    const pend = !!busy.zones || known.some(z => isPending(z.climate));
    const lock = vaillantLocked();
    const sub = pend ? "застосовується…" : awayOn() ? "заблоковано відсутністю" : syncing() ? "синхронізація…"
      : onCount === 0 ? "вимкнено" : onCount === known.length ? "усі зони" : `${onCount} з ${known.length} зон`;
    btns.push(`<button class="qbtn ${onCount && !lock ? "on" : ""} ${pend ? "pend" : ""}" data-q="heat" ${lock || pend || !known.length ? "disabled" : ""}>
      <span class="ic">🔥</span><span class="lb">Опалення</span><span class="st">${sub}</span></button>`);
  }
  const hp = H.heatpump.switch;
  if (hp && st(hp)) {
    const on = val(hp) === "on", pend = isPending(hp) || !!busy[hp];
    btns.push(`<button class="qbtn ${on ? "on" : ""} ${pend ? "pend" : ""}" data-q="hp" ${pend ? "disabled" : ""}>
      <span class="ic">♨️</span><span class="lb">Тепловий насос</span><span class="st">${pend ? "застосовується…" : on ? "працює" : "вимкнено"}</span></button>`);
  }
  return btns.length ? `<div class="quick" style="grid-template-columns:repeat(${btns.length},1fr)">${btns.join("")}</div>` : "";
}

function zoneCard(z) {
  const id = z.climate, x = st(id);
  if (!x) return `<div class="card muted">${esc(z.icon)} ${esc(z.name)}: немає даних</div>`;
  const mode = x.s, off = mode === "off", lock = vaillantLocked(), dis = lock || !!busy[id] || !!busy.zones;
  const p = pendingTemp[id];
  const target = p ? p.value : attr(id, "temperature");
  const special = val(z.special);
  const specialPill = special && !["None", "NONE", "none"].includes(special) ? `<span class="pill p-warn">${esc(special)}</span>` : "";
  const status = syncPill() || pendPill(id) || (off ? offPill : attr(id, "hvac_action") === "heating" ? heatPill : "");
  return `<div class="card ${lock ? "locked" : ""} ${busy[id] ? "pending" : ""}">
    <div class="row between"><div class="title">${esc(z.icon)} ${esc(z.name)}</div>
      <div class="row" style="gap:6px">${specialPill}${status}</div></div>
    <div class="row between" style="margin-top:8px">
      <div><div class="big">${fmt(attr(id, "current_temperature"), 1)}°</div><div class="muted small">вологість ${fmt(num(z.humidity))}%</div></div>
      <div class="temp-ctl">
        <button class="btn" data-temp="${id}" data-d="-1" ${off || dis ? "disabled" : ""}>−</button>
        <div class="val ${p ? "pending" : ""}">${off ? "—" : fmt(target, 1) + "°"}</div>
        <button class="btn" data-temp="${id}" data-d="1" ${off || dis ? "disabled" : ""}>+</button>
      </div></div>
    <div class="seg">${ZONE_MODES.filter(([m]) => (x.a.hvac_modes || []).includes(m)).map(([m, l]) =>
      `<button class="btn ${mode === m ? "on" : ""}" data-mode="${id}" data-m="${m}" ${dis ? "disabled" : ""}>${l}</button>`).join("")}</div>
    ${lockLine()}
  </div>`;
}

const DHW_MODES = {"Manual": "Ручний", "Time Controlled": "Розклад", "Off": "Вимк", "Cylinder Boost": "Буст"};
const dhwName = (m) => DHW_MODES[m] || m;

function dhwCard(D) {
  const id = D.water_heater; if (!id) return "";
  const x = st(id);
  if (!x) return `<div class="card muted">🚿 Гаряча вода: немає даних</div>`;
  const mode = x.a.operation_mode || x.s, off = mode === "Off" || mode === "off";
  const lock = vaillantLocked(), dis = lock || !!busy[id];
  const p = pendingTemp[id];
  const target = p ? p.value : x.a.temperature;
  const modes = x.a.operation_list || [];
  const status = syncPill() || pendPill(id) || (off ? offPill
    : `<span class="pill ${mode === "Cylinder Boost" ? "p-heat" : "p-ok"}">${mode === "Cylinder Boost" ? "🔥 " : ""}${esc(dhwName(mode))}</span>`);
  return `<div class="card ${lock ? "locked" : ""} ${busy[id] ? "pending" : ""}">
    <div class="row between"><div class="title">🚿 Гаряча вода</div>${status}</div>
    <div class="row between" style="margin-top:8px">
      <div><div class="big">${fmt(x.a.current_temperature, 1)}°</div><div class="muted small">в бойлері</div></div>
      <div class="temp-ctl">
        <button class="btn" data-temp="${id}" data-d="-1" ${off || dis ? "disabled" : ""}>−</button>
        <div class="val ${p ? "pending" : ""}">${off ? "—" : fmt(target, 0) + "°"}</div>
        <button class="btn" data-temp="${id}" data-d="1" ${off || dis ? "disabled" : ""}>+</button>
      </div></div>
    <div class="seg">${modes.map(m =>
      `<button class="btn ${mode === m ? "on" : ""}" data-dhwmode="${id}" data-m="${esc(m)}" ${dis ? "disabled" : ""}>${esc(dhwName(m))}</button>`).join("")}</div>
    ${lockLine()}
  </div>`;
}

function heatpumpCard(hp) {
  if (!hp.switch && !hp.temp_heating && !hp.flow) return "";
  const on = val(hp.switch) === "on";
  const status = pendPill(hp.switch) || (on ? `<span class="pill p-heat">🔥 працює</span>` : offPill);
  return `<div class="card">
    <div class="row between"><div class="title">♨️ Тепловий насос</div>${hp.switch ? status : ""}</div>
    <div class="metrics" style="grid-template-columns:1fr 1fr;padding:14px 0 2px">
      ${metric(num(hp.temp_heating || hp.flow), 1, "°C", "опалення")}
      ${metric(num(hp.temp_dhw || hp.temperature), 1, "°C", "гаряча вода")}
    </div>
  </div>`;
}

function viewHeating() {
  const H = S.layout.heating;
  return outageBanner() + heatingMetrics(H) + quickButtons(H) +
    H.zones.map(zoneCard).join("") + dhwCard(H.dhw || {}) + heatpumpCard(H.heatpump);
}

// In-page chooser: Telegram popups allow at most three buttons.
function choose(title, text, options, okText) {
  return new Promise(res => {
    const root = $("#sheet-root");
    let chosen = options[0][0];
    root.innerHTML = `<div class="overlay" role="dialog" aria-modal="true"><div class="sheet">
      <h3>${esc(title)}</h3><p>${esc(text)}</p>
      <div class="chips">${options.map(([v, l], i) => `<button class="chip ${i ? "" : "on"}" data-v="${i}">${esc(l)}</button>`).join("")}</div>
      <div class="sbtns"><button data-a="no">Скасувати</button><button data-a="yes">${esc(okText)}</button></div>
    </div></div>`;
    const close = (v) => { root.innerHTML = ""; res(v); };
    root.querySelector(".overlay").addEventListener("click", e => {
      const c = e.target.closest(".chip");
      if (c) { chosen = options[Number(c.dataset.v)][0]; root.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c)); return; }
      const b = e.target.closest("[data-a]");
      if (b) close(b.dataset.a === "yes" ? {value: chosen} : null);
      else if (e.target.classList.contains("overlay")) close(null);
    });
  });
}

async function onQuick(q) {
  const H = S.layout.heating;
  haptic();
  if (q === "away") {
    const sw = awaySw();
    if (awayOn()) {
      if (!await confirmBox("Вимкнути режим відсутності? Опалення і гаряча вода повернуться до звичайних режимів, стан Vaillant оновиться.")) return;
      return act({action: "switch_off", entity_id: sw}, "Режим відсутності", "away");
    }
    const r = await choose("Режим відсутності", "Опалення і гаряча вода перейдуть на мінімум, керування зонами буде заблоковане.\nНа скільки?",
      [[null, "До скасування"], [1, "1 день"], [3, "3 дні"], [7, "7 днів"]], "Увімкнути");
    if (!r) return;
    return act({action: "away_on", days: r.value}, "Режим відсутності", "away");
  }
  if (q === "heat") {
    const anyOn = H.zones.some(z => st(z.climate) && val(z.climate) !== "off");
    if (anyOn) {
      if (!await confirmBox("Вимкнути опалення в усіх зонах?")) return;
      return act({action: "zones_off"}, "Опалення", "zones");
    }
    if (!await confirmBox("Увімкнути опалення в усіх зонах? Кожна зона повернеться в свій останній режим (або «Розклад»).")) return;
    return act({action: "zones_on"}, "Опалення", "zones");
  }
  if (q === "hp") {
    const hp = H.heatpump, on = val(hp.switch) === "on";
    const ok = !on && gridDown() ? await confirmTurnOn("Тепловий насос", hp.power_w)
      : await confirmBox(on ? "Вимкнути тепловий насос?" : "Увімкнути тепловий насос?");
    if (!ok) return;
    return act({action: on ? "switch_off" : "switch_on", entity_id: hp.switch}, "Тепловий насос");
  }
}

const AC_MODES = [["heat", "🔥"], ["cool", "❄️"], ["auto", "🔄"], ["dry", "💧"], ["fan_only", "🌀"]];
const AC_MODE_NAME = {heat: "обігрів", cool: "охолодження", auto: "авто", dry: "осушення", fan_only: "вентилятор", off: "вимкнено"};
const FAN_NAME = {auto: "авто", low: "низька", middle_low: "нижче сер.", medium: "середня", middle_high: "вище сер.", high: "висока"};

function lastAcMode(id) {
  try { return localStorage.getItem("tgapp.ac." + id) || null; } catch (e) { return null; }
}
function rememberAcMode(id, m) { try { localStorage.setItem("tgapp.ac." + id, m); } catch (e) {} }

const acItem = (id) => S.layout.ac.find(a => a.climate === id) || {};
const acName = (id) => acItem(id).name || id;
const acPower = (id) => acItem(id).power_w;

function viewAc() {
  return outageBanner() + S.layout.ac.map(a => {
    const id = a.climate, x = st(id);
    if (!x) return `<div class="card muted">${esc(a.icon)} ${esc(a.name)}: немає даних</div>`;
    const mode = x.s, off = mode === "off", b = !!busy[id];
    const p = pendingTemp[id];
    const target = p ? p.value : x.a.temperature;
    const cls = off ? "p-off" : mode === "heat" ? "p-heat" : mode === "cool" ? "p-cool" : "p-ok";
    const fans = x.a.fan_modes || [];
    return `<div class="card ${b ? "pending" : ""}">
      <div class="row between"><div class="title">${esc(a.icon)} ${esc(a.name)}</div>
        ${isPending(id) ? pendPill(id) : `<span class="pill ${cls}">${esc(AC_MODE_NAME[mode] || mode)}</span>`}</div>
      <div class="row between" style="margin-top:8px">
        <div><div class="big">${fmt(x.a.current_temperature, 0)}°</div><div class="muted small">в кімнаті</div></div>
        <div class="temp-ctl">
          <button class="btn" data-temp="${id}" data-d="-1" ${off || b ? "disabled" : ""}>−</button>
          <div class="val ${p ? "pending" : ""}">${off ? "—" : fmt(target, (Number(x.a.target_temp_step) || 1) < 1 ? 1 : 0) + "°"}</div>
          <button class="btn" data-temp="${id}" data-d="1" ${off || b ? "disabled" : ""}>+</button>
        </div></div>
      <div class="seg">
        <button class="btn ${off ? "primary" : ""}" data-power="${id}" ${b ? "disabled" : ""}>${off ? "⏻ Увімкнути" : "⏻ Вимкнути"}</button>
      </div>
      <div class="seg">${AC_MODES.filter(([m]) => (x.a.hvac_modes || []).includes(m)).map(([m, l]) =>
        `<button class="btn ${mode === m ? "on" : ""}" data-acmode="${id}" data-m="${m}" title="${AC_MODE_NAME[m]}" ${b ? "disabled" : ""}>${l}</button>`).join("")}</div>
      ${fans.length && !off ? `<div class="row between" style="margin-top:10px"><span class="muted small">Вентилятор</span>
        <select data-fan="${id}" ${b ? "disabled" : ""}>${fans.map(f => `<option value="${esc(f)}" ${f === x.a.fan_mode ? "selected" : ""}>${esc(FAN_NAME[f] || f)}</option>`).join("")}</select></div>` : ""}
    </div>`;
  }).join("");
}

let deferred = false;     // a re-render was skipped while a <select> was open
function render() {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (!S) return;
  const a = document.activeElement;
  if (a && a.tagName === "SELECT" && $("#app").contains(a)) { deferred = true; return; }
  deferred = false;
  const v = tab === "heating" ? viewHeating() : tab === "ac" ? viewAc() : viewEnergy();
  $("#app").innerHTML = v;
}

// ---------- events ----------
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  tab = b.dataset.tab; haptic("soft");
  try { localStorage.setItem("tgapp.tab", tab); } catch (e2) {}
  render(); window.scrollTo(0, 0);
});

$("#app").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.dataset.temp) return bumpTemp(b.dataset.temp, Number(b.dataset.d));
  if (b.dataset.mode) {
    haptic();
    return act({action: "set_hvac_mode", entity_id: b.dataset.mode, hvac_mode: b.dataset.m}, "Режим зони");
  }
  if (b.dataset.q) return onQuick(b.dataset.q);
  if (b.dataset.dhwmode) {
    haptic();
    return act({action: "set_operation_mode", entity_id: b.dataset.dhwmode, operation_mode: b.dataset.m}, "Гаряча вода");
  }
  if (b.dataset.power) {
    const id = b.dataset.power, x = st(id); haptic();
    if (x.s === "off") {
      if (!(await confirmTurnOn("Кондиціонер «" + acName(id) + "»", acPower(id)))) return;
      const month = new Date().getMonth();
      const fallback = (month >= 4 && month <= 8) ? "cool" : "heat";
      const m = lastAcMode(id) || fallback;
      return act({action: "set_hvac_mode", entity_id: id, hvac_mode: (x.a.hvac_modes || []).includes(m) ? m : fallback}, "Кондиціонер");
    }
    rememberAcMode(id, x.s);
    return act({action: "set_hvac_mode", entity_id: id, hvac_mode: "off"}, "Кондиціонер");
  }
  if (b.dataset.acmode) {
    const id = b.dataset.acmode, x = st(id);
    if (x && x.s === "off" && b.dataset.m !== "off" &&
        !(await confirmTurnOn("Кондиціонер «" + acName(id) + "»", acPower(id)))) return;
    haptic(); rememberAcMode(id, b.dataset.m);
    return act({action: "set_hvac_mode", entity_id: b.dataset.acmode, hvac_mode: b.dataset.m}, "Режим кондиціонера");
  }
});

$("#app").addEventListener("focusout", e => {
  if (e.target.tagName === "SELECT" && deferred) setTimeout(render, 0);
});

$("#app").addEventListener("change", e => {
  const s = e.target.closest("select[data-fan]"); if (!s) return;
  s.blur();
  act({action: "set_fan_mode", entity_id: s.dataset.fan, fan_mode: s.value}, "Вентилятор");
});

let refreshing = false;
$("#refresh").addEventListener("click", async () => {
  if (refreshing) return;
  refreshing = true; haptic("soft");
  $("#refresh").classList.add("spin"); $("#foot").textContent = "Оновлюю…";
  try { await api("/api/tgapp/action", {method: "POST", body: {action: "refresh"}}); }
  catch (e) { if (e.status === 429) toast("Забагато команд, зачекай хвилину"); }
  finally {
    await load();
    refreshing = false; $("#refresh").classList.remove("spin");
  }
});

// ---------- polling ----------
let timer = null;
function startPolling() { if (!timer) timer = setInterval(() => { if (!document.hidden && !Object.keys(busy).length && !Object.keys(pendingTemp).length) load(); }, POLL_MS); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
render();
load().then(startPolling);
</script>
</body>
</html>
